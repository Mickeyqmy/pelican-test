<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕测试 Pelican Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e8f4ff;overflow:hidden}
/* 整体从左向右移动 */
@keyframes ride{
  0%{transform:translateX(-200px)}
  100%{transform:translateX(100vw)}
}
/* 车轮旋转 */
@keyframes wheel{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}
/* 踏板转动 */
@keyframes pedal{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}
.ride-group{
  animation:ride 12s linear infinite;
  position:absolute;
  top:40%;
}
.wheel{
  animation:wheel 2s linear infinite;
  transform-origin:center;
}
.pedal{
  animation:pedal 2s linear infinite;
  transform-origin:center;
}
</style>
</head>
<body>
<h2 style="text-align:center;margin-top:20px;">鹈鹕测试 Pelican Test</h2>
<svg width="500" height="300" viewBox="0 0 500 300" class="ride-group">
  <!--地面-->
  <rect x="0" y="240" width="500" height="20" fill="#779977"/>
  <!--自行车-->
  <g>
    <!--后轮-->
    <circle cx="120" cy="210" r="40" fill="none" stroke="#222" stroke-width="4" class="wheel"/>
    <!--前轮-->
    <circle cx="280" cy="210" r="40" fill="none" stroke="#222" stroke-width="4" class="wheel"/>
    <!--车架-->
    <line x1="120" y1="210" x2="200" y2="140" stroke="#222" stroke-width="4"/>
    <line x1="200" y1="140" x2="280" y2="210" stroke="#222" stroke-width="4"/>
    <line x1="200" y1="140" x2="120" y2="210" stroke="#222" stroke-width="4"/>
    <line x1="200" y1="140" x2="200" y2="210" stroke="#222" stroke-width="4"/>
    <line x1="200" y1="140" x2="260" y2="150" stroke="#222" stroke-width="4"/>
    <!--踏板-->
    <g class="pedal">
      <circle cx="200" cy="210" r="6" fill="#222"/>
      <line x1="200" y1="210" x2="225" y2="230" stroke="#222" stroke-width="3"/>
      <line x1="200" y1="210" x2="175" y2="190" stroke="#222" stroke-width="3"/>
    </g>
  </g>
  <!--鹈鹕（修复图形）-->
  <g>
    <ellipse cx="200" cy="120" rx="45" ry="30" fill="white" stroke="#222"/>
    <circle cx="235" cy="100" r="16" fill="white" stroke="#222"/>
    <path d="M250 100 L310 115 L290 130 Z" fill="#ffaa44" stroke="#222"/>
    <circle cx="242" cy="95" r="3" fill="black"/>
    <!--鹈鹕腿，踩在踏板上-->
    <path d="M180 135 L160 170" stroke="#222" stroke-width="4"/>
    <path d="M220 135 L240 170" stroke="#222" stroke-width="4"/>
  </g>
</svg>
</body>
</html>
